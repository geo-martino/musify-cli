[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "mytunes-cli"
authors = [
  { name="George Martin Marino", email="gm.engineer+mytunes@pm.me" },
]
description = "CLI operations for MyTunes package"
readme = "README.md"
license-files = { paths = ["LICENSE"] }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "mytunes[all]",
    "pydantic-settings~=2.14.1",
    "pydantic-settings-logging~=0.1.1",
    "pyfiglet~=1.0",
    "pyyaml~=6.0.3",
    # "docstring_parser>=0.16,<1.0",
]

[dependency-groups]
dev = [
    "flake8",
    "grip",
]
test = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-xdist~=3.8.0",
    "pytest-mock~=3.15.1",
    "Faker~=40.18.0",
]

[tool.uv]
default-groups = ["dev", "test"]
package = true

# TODO: remove me on release
[tool.uv.sources]
mytunes = { git = "https://github.com/geo-martino/musify", branch = "v2/pydanticify" }

[project.urls]
"Source code" = "https://github.com/geo-martino/mytunes-cli"
Issues = "https://github.com/geo-martino/mytunes-cli/issues"

[project.scripts]
mytunes = "mytunes_cli.__main__:main"


[tool.hatch.version]
path = "mytunes_cli/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--color=yes"
markers = [
    "slow: marks test as slow (deselect with '-m \"not slow\"')",
    "manual: marks tests to be run only when manually directed to by the developer",
]
filterwarnings = "ignore::UserWarning"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
